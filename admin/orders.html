<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow Admin — অর্ডার</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="../customer/orders.css">
</head><body>
<div class="app">
  <header class="ad-top">
    <a href="dashboard.html" class="ad-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="flex:1"><div class="t1">সব অর্ডার</div><div class="t2">কাস্টমার ও বায়ারের সব অর্ডার</div></div>
  </header>
  <div style="padding:12px 22px 2px;background:var(--bg)">
    <div class="od-tabs">
      <button class="od-tab active" data-tab="active">চলমান <span id="ao-c-active">0</span></button>
      <button class="od-tab" data-tab="completed">সম্পন্ন <span id="ao-c-completed">0</span></button>
      <button class="od-tab" data-tab="cancelled">বাতিল <span id="ao-c-cancelled">0</span></button>
    </div>
  </div>
  <main class="content scroll">
    <div id="ao-list" class="od-list"></div>
    <p id="ao-empty" class="od-empty" hidden>কোনো অর্ডার নেই।</p>
  </main>
  <nav id="bottom-nav" class="bottom-nav admin-nav"></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/app.js"></script>
<script>(async()=>{ if(window.cfRequireRole) await window.cfRequireRole("admin","login.html"); })();</script>
<script src="orders.js"></script>
</body></html>
