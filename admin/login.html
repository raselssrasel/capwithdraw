<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow Admin — লগইন</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
</head><body>
<div class="app" style="background:#0E1016">
  <div style="position:absolute;top:-80px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(10,133,96,.25),rgba(10,133,96,0) 70%)"></div>
  <div style="padding:84px 28px 0;position:relative;z-index:1">
    <div style="width:58px;height:58px;border-radius:17px;background:#1A1E27;border:1px solid #2A2F3A;display:flex;align-items:center;justify-content:center;margin-bottom:24px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2DD4A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;background:#1A1E27;border:1px solid #2A2F3A;padding:5px 11px;border-radius:999px;font-size:11px;color:#8A93A1;margin-bottom:14px"><span style="width:6px;height:6px;border-radius:50%;background:#2DD4A7"></span>অ্যাডমিন কন্ট্রোল প্যানেল</div>
    <h1 style="font-family:var(--font-display);font-weight:700;font-size:26px;color:#fff;margin:0 0 6px;letter-spacing:-.5px">CapFlow Admin</h1>
    <p style="color:#8A93A1;font-size:14px;margin:0 0 30px">সীমিত অ্যাক্সেস। শুধু অনুমোদিত স্টাফ।</p>

    <label style="font-size:12.5px;font-weight:600;color:#9AA3B1;display:block;margin-bottom:8px">অ্যাডমিন ইমেইল</label>
    <div style="height:54px;border-radius:14px;background:#1A1E27;border:1.5px solid #2A2F3A;display:flex;align-items:center;padding:0 15px;gap:11px;margin-bottom:16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B7585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
      <input id="ad-email" type="email" placeholder="admin@email.com" style="flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:#fff;min-width:0">
    </div>
    <label style="font-size:12.5px;font-weight:600;color:#9AA3B1;display:block;margin-bottom:8px">পাসওয়ার্ড</label>
    <div style="height:54px;border-radius:14px;background:#1A1E27;border:1.5px solid #2A2F3A;display:flex;align-items:center;padding:0 15px;gap:11px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B7585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="ad-pass" type="password" placeholder="পাসওয়ার্ড" style="flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:#fff;min-width:0">
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:16px;color:#6B7585;font-size:11.5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2DD4A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>২-ফ্যাক্টর অথেনটিকেশন দিয়ে সুরক্ষিত।</div>
  </div>
  <div style="margin-top:auto;padding:0 28px 36px;position:relative;z-index:1">
    <div id="ad-msg" class="au-msg" hidden style="margin-bottom:12px"></div>
    <button id="ad-btn" class="btn btn-primary">অ্যাডমিনে সাইন ইন</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<link rel="stylesheet" href="../assets/css/auth.css">
<script>
  const adBtn=document.getElementById('ad-btn');
  const adMsg=document.getElementById('ad-msg');
  function show(t,ok){ adMsg.hidden=false; adMsg.textContent=t; adMsg.className='au-msg '+(ok?'ok':'err'); }
  adBtn.addEventListener('click', async ()=>{
    const email=document.getElementById('ad-email').value.trim();
    const pass=document.getElementById('ad-pass').value;
    if(!email||!pass){ show('ইমেইল ও পাসওয়ার্ড দিন।',false); return; }
    adBtn.disabled=true; adBtn.textContent='অপেক্ষা করুন…';
    const res=await window.cfSignIn({email,password:pass});
    adBtn.disabled=false; adBtn.textContent='অ্যাডমিনে সাইন ইন';
    if(!res.ok){ show(res.msg,false); return; }
    const { data: prof } = await window.cfSupabase.from('profiles').select('role').eq('id',res.user.id).single();
    if(prof && prof.role==='admin'){ window.location.href='dashboard.html'; }
    else { show('এই অ্যাকাউন্ট অ্যাডমিন নয়।',false); await window.cfSignOut(); }
  });
</script>
</body></html>
