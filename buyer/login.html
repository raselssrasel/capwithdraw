<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow Buyer — লগইন</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="buyer.css">
</head>
<body>
<div class="app" style="background:var(--slate)">
  <div style="position:absolute;top:-90px;right:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(45,212,167,.28),rgba(45,212,167,0) 70%)"></div>

  <div style="padding:76px 26px 0;position:relative;z-index:1">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:34px">
      <div style="width:46px;height:46px;border-radius:14px;background:var(--jade);display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7H8a4 4 0 0 0 0 8h5"/><path d="M13 11l4 4-4 4"/><path d="M12 3v3M12 18v3"/></svg>
      </div>
      <div><div style="font-family:var(--font-display);font-weight:800;font-size:21px;color:#fff">Cap<span style="color:#2DD4A7">Flow</span></div><div style="font-size:11px;color:#8FA0BC;margin-top:1px">বায়ার ওয়ার্কস্পেস</div></div>
    </div>
    <h1 style="font-family:var(--font-display);font-weight:700;font-size:26px;color:#fff;margin:0 0 6px;letter-spacing:-.5px">বায়ার লগইন</h1>
    <p style="color:#8FA0BC;font-size:14px;margin:0 0 30px">অর্ডার ও অফার পরিচালনা করতে সাইন ইন করুন।</p>

    <label style="font-size:12.5px;font-weight:600;color:#AEB9CF;display:block;margin-bottom:8px">ইমেইল</label>
    <div style="height:54px;border-radius:14px;background:var(--slate-2);border:1.5px solid var(--slate-line);display:flex;align-items:center;padding:0 15px;gap:11px;margin-bottom:16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7E90AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
      <input id="by-email" type="email" placeholder="your@email.com" style="flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:#fff;min-width:0">
    </div>
    <label style="font-size:12.5px;font-weight:600;color:#AEB9CF;display:block;margin-bottom:8px">পাসওয়ার্ড</label>
    <div style="height:54px;border-radius:14px;background:var(--slate-2);border:1.5px solid var(--slate-line);display:flex;align-items:center;padding:0 15px;gap:11px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7E90AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="by-pass" type="password" placeholder="পাসওয়ার্ড" style="flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:#fff;min-width:0">
    </div>
  </div>

  <div style="margin-top:auto;padding:0 26px 34px;position:relative;z-index:1">
    <div id="by-msg" class="au-msg" hidden style="margin-bottom:12px"></div>
    <button id="by-btn" class="btn btn-primary">সাইন ইন</button>
    <div style="text-align:center;margin-top:14px;font-size:12.5px;color:#6A7A96;display:flex;align-items:center;justify-content:center;gap:7px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6A7A96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      অনুমোদিত বায়ারদের জন্য প্রাইভেট অ্যাক্সেস
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<link rel="stylesheet" href="../assets/css/auth.css">
<script>
  const byBtn=document.getElementById('by-btn');
  const byMsg=document.getElementById('by-msg');
  function show(t,ok){ byMsg.hidden=false; byMsg.textContent=t; byMsg.className='au-msg '+(ok?'ok':'err'); }
  byBtn.addEventListener('click', async ()=>{
    const email=document.getElementById('by-email').value.trim();
    const pass=document.getElementById('by-pass').value;
    if(!email||!pass){ show('ইমেইল ও পাসওয়ার্ড দিন।',false); return; }
    byBtn.disabled=true; byBtn.textContent='অপেক্ষা করুন…';
    const res=await window.cfSignIn({email,password:pass});
    byBtn.disabled=false; byBtn.textContent='সাইন ইন';
    if(!res.ok){ show(res.msg,false); return; }
    // role যাচাই — শুধু buyer হলে ঢুকবে
    const { data: prof } = await window.cfSupabase.from('profiles').select('role').eq('id',res.user.id).single();
    if(prof && prof.role==='buyer'){ window.location.href='dashboard.html'; }
    else { show('এই অ্যাকাউন্ট বায়ার নয়।',false); await window.cfSignOut(); }
  });
</script>
</body>
</html>
