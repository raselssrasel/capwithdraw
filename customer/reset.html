<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow — নতুন পাসওয়ার্ড</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<div class="app">
  <div class="au-body" style="padding-top:62px">
    <div class="au-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 class="au-h1">নতুন পাসওয়ার্ড দিন</h1>
    <p class="au-p">আপনার নতুন পাসওয়ার্ড লিখুন (কমপক্ষে ৬ অক্ষর)।</p>
    <div class="au-fields">
      <div class="au-field">
        <label class="au-label">নতুন পাসওয়ার্ড</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="rs-pass" type="password" placeholder="নতুন পাসওয়ার্ড">
        </div>
      </div>
      <div id="rs-msg" class="au-msg" hidden></div>
    </div>
  </div>
  <div class="au-foot">
    <button id="rs-btn" class="btn btn-primary">পাসওয়ার্ড বদলান</button>
    <div class="au-switch"><a href="signin.html">সাইন ইন</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script>
  const btn = document.getElementById('rs-btn');
  const msg = document.getElementById('rs-msg');
  function show(t, ok){ msg.hidden=false; msg.textContent=t; msg.className='au-msg '+(ok?'ok':'err'); }

  btn.addEventListener('click', async () => {
    const pass = document.getElementById('rs-pass').value;
    if (pass.length < 6) { show('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।', false); return; }
    btn.disabled = true; btn.textContent = 'বদলানো হচ্ছে…';
    try {
      const db = window.cfSupabase;
      const { error } = await db.auth.updateUser({ password: pass });
      if (error) { show(error.message, false); }
      else { show('✅ পাসওয়ার্ড বদলানো হয়েছে! এখন সাইন ইন করুন।', true);
             setTimeout(()=>{ window.location.href='signin.html'; }, 1800); }
    } catch (e) { show('সমস্যা: ' + (e.message||e), false); }
    btn.disabled = false; btn.textContent = 'পাসওয়ার্ড বদলান';
  });
</script>
</body>
</html>
