<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow — পাসওয়ার্ড রিসেট</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<div class="app">

  <div class="au-top">
    <a href="signin.html" class="au-back" aria-label="ফিরে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="au-body">
    <div class="au-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 class="au-h1">পাসওয়ার্ড ভুলে গেছেন?</h1>
    <p class="au-p">আপনার ইমেইল দিন — আমরা একটি রিসেট লিংক পাঠাব।</p>

    <div class="au-fields">
      <div class="au-field">
        <label class="au-label">ইমেইল</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
          <input id="fg-email" type="email" placeholder="your@email.com">
        </div>
      </div>
      <div id="fg-msg" class="au-msg" hidden></div>
    </div>
  </div>

  <div class="au-foot">
    <button id="fg-btn" class="btn btn-primary">রিসেট লিংক পাঠান</button>
    <div class="au-switch">মনে পড়েছে? <a href="signin.html">সাইন ইন</a></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script>
  const btn = document.getElementById('fg-btn');
  const msg = document.getElementById('fg-msg');
  function show(t, ok){ msg.hidden=false; msg.textContent=t; msg.className='au-msg '+(ok?'ok':'err'); }

  btn.addEventListener('click', async () => {
    const email = document.getElementById('fg-email').value.trim();
    if (!email) { show('আপনার ইমেইল দিন।', false); return; }
    btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে…';
    try {
      const db = window.cfSupabase;
      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/customer/reset.html'
      });
      if (error) { show(error.message, false); }
      else { show('✅ রিসেট লিংক পাঠানো হয়েছে। আপনার ইমেইল (ও স্প্যাম ফোল্ডার) দেখুন।', true); }
    } catch (e) { show('সমস্যা: ' + (e.message||e), false); }
    btn.disabled = false; btn.textContent = 'রিসেট লিংক পাঠান';
  });
</script>
</body>
</html>
