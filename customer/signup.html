<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow — অ্যাকাউন্ট তৈরি</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<div class="app">

  <div class="au-top" style="display:flex;align-items:center;gap:14px;padding-bottom:4px">
    <a href="welcome.html" class="au-back" aria-label="ফিরে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.4px;color:var(--ink)">অ্যাকাউন্ট তৈরি</div>
      <div style="color:var(--ink-2);font-size:13px;margin-top:2px">মাত্র এক মিনিট লাগবে</div>
    </div>
  </div>

  <main class="content scroll" style="padding:8px 24px 0">
    <div class="au-photo">
      <div class="au-photo-ring">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div class="add"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
      <span class="au-photo-txt">আসল প্রোফাইল ছবি দিন</span>
    </div>

    <div class="au-fields" style="padding-bottom:20px">
      <div class="au-field">
        <label class="au-label">পুরো নাম</label>
        <div class="au-input"><input id="su-name" type="text" placeholder="আপনার নাম"></div>
      </div>
      <div class="au-field">
        <label class="au-label">ইমেইল</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
          <input id="su-email" type="email" placeholder="your@email.com">
        </div>
      </div>
      <div class="au-field">
        <label class="au-label">পাসওয়ার্ড</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="su-pass" type="password" placeholder="কমপক্ষে ৬ অক্ষর">
        </div>
      </div>
      <div class="au-field">
        <label class="au-label">ফোন নম্বর</label>
        <div class="au-input">
          <span class="prefix">+880</span>
          <span class="divider"></span>
          <input id="su-phone" type="tel" placeholder="1712 345 678">
        </div>
      </div>
      <div id="su-msg" class="au-msg" hidden></div>
    </div>
  </main>

  <div class="au-foot" style="margin-top:0">
    <button id="su-btn" class="btn btn-primary">অ্যাকাউন্ট তৈরি করুন</button>
    <div class="au-switch">আগে থেকে অ্যাকাউন্ট আছে? <a href="signin.html">সাইন ইন</a></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script>
  const suBtn = document.getElementById('su-btn');
  const suMsg = document.getElementById('su-msg');

  function showMsg(text, ok) {
    suMsg.hidden = false;
    suMsg.textContent = text;
    suMsg.className = 'au-msg ' + (ok ? 'ok' : 'err');
  }

  suBtn.addEventListener('click', async () => {
    const fullName = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-pass').value;
    const phone = document.getElementById('su-phone').value.trim();

    if (!fullName || !email || !password) {
      showMsg('নাম, ইমেইল ও পাসওয়ার্ড দিন।', false); return;
    }
    if (password.length < 6) {
      showMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।', false); return;
    }

    suBtn.disabled = true;
    suBtn.textContent = 'তৈরি হচ্ছে…';
    const res = await window.cfSignUp({
      email, password, fullName,
      phone: phone ? ('+880 ' + phone) : null
    });
    suBtn.disabled = false;
    suBtn.textContent = 'অ্যাকাউন্ট তৈরি করুন';

    if (res.ok) {
      window.location.href = 'home.html';
    } else {
      showMsg(res.msg, false);
    }
  });
</script>
</body>
</html>
