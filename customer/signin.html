<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow — সাইন ইন</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<div class="app">

  <div class="au-top">
    <a href="welcome.html" class="au-back" aria-label="ফিরে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="au-body">
    <div class="au-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7H8a4 4 0 0 0 0 8h5"/><path d="M13 11l4 4-4 4"/><path d="M12 3v3M12 18v3"/></svg>
    </div>
    <h1 class="au-h1">আবার স্বাগতম</h1>
    <p class="au-p">CapFlow-এ চালিয়ে যেতে সাইন ইন করুন</p>

    <div class="au-fields">
      <div class="au-field">
        <label class="au-label">ইমেইল</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
          <input id="si-email" type="email" placeholder="your@email.com">
        </div>
      </div>
      <div class="au-field">
        <label class="au-label">পাসওয়ার্ড</label>
        <div class="au-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="si-pass" type="password" placeholder="পাসওয়ার্ড">
          <svg id="si-eye" style="cursor:pointer" viewBox="0 0 24 24" fill="none" stroke="#9AA3B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
      <div class="au-forgot"><a href="forgot.html">পাসওয়ার্ড ভুলে গেছেন?</a></div>
      <div id="si-msg" class="au-msg" hidden></div>
    </div>
  </div>

  <div class="au-foot">
    <button id="si-btn" class="btn btn-primary">সাইন ইন</button>
    <div class="au-switch">নতুন? <a href="signup.html">অ্যাকাউন্ট তৈরি করুন</a></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script>
  const siBtn = document.getElementById('si-btn');
  const siMsg = document.getElementById('si-msg');

  function showMsg(text, ok) {
    siMsg.hidden = false;
    siMsg.textContent = text;
    siMsg.className = 'au-msg ' + (ok ? 'ok' : 'err');
  }

  // চোখের আইকন — পাসওয়ার্ড দেখানো/লুকানো
  document.getElementById('si-eye').addEventListener('click', () => {
    const p = document.getElementById('si-pass');
    p.type = (p.type === 'password') ? 'text' : 'password';
  });

  siBtn.addEventListener('click', async () => {
    const email = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-pass').value;
    if (!email || !password) { showMsg('ইমেইল ও পাসওয়ার্ড দিন।', false); return; }

    siBtn.disabled = true;
    siBtn.textContent = 'অপেক্ষা করুন…';
    const res = await window.cfSignIn({ email, password });
    siBtn.disabled = false;
    siBtn.textContent = 'সাইন ইন';

    if (res.ok) {
      window.location.href = 'home.html';
    } else {
      showMsg(res.msg, false);
    }
  });
</script>
</body>
</html>
