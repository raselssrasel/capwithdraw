<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapFlow — নতুন উইথড্র</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="order-setup.css">
</head>
<body>
<div class="app">

  <header class="topbar os-top">
    <a href="marketplace.html" class="os-back" aria-label="ফিরে যান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <div class="os-h1">নতুন উইথড্র</div>
      <div id="os-with" class="os-h2"></div>
    </div>
  </header>

  <main class="content scroll">
    <div class="os-wrap">

      <!-- USD পরিমাণ -->
      <label class="os-label">মোট USD উইথড্র করবেন</label>
      <div class="os-usd">
        <div class="os-usd-in">
          <span class="os-usd-cur">$</span>
          <input id="os-usd" value="150" inputmode="numeric">
        </div>
        <div class="os-usd-limit">লিমিট<br><span id="os-limit"></span></div>
      </div>

      <!-- পেমেন্ট মেথড -->
      <div class="os-label">পেমেন্ট মেথড <span class="os-label-dim">· এই বায়ার যা নেন</span></div>
      <div id="os-pays" class="os-pays"></div>

    

      <!-- অ্যাকাউন্ট সংখ্যা -->
      <div class="os-label">CapCut অ্যাকাউন্ট সংখ্যা</div>
      <div class="os-acc">
        <span class="os-acc-l">অ্যাকাউন্ট</span>
        <div class="os-acc-ctrl">
          <button id="os-minus" class="os-step" aria-label="কমান">−</button>
          <span id="os-count" class="os-count">1</span>
          <button id="os-plus" class="os-step plus" aria-label="বাড়ান">+</button>
        </div>
      </div>

      <!-- সারাংশ -->
      <div class="os-summary">
        <div class="os-sum-row"><span>USD পরিমাণ</span><span id="os-s-usd" class="v"></span></div>
        <div class="os-sum-row"><span>রেট</span><span id="os-s-rate" class="v"></span></div>
        <div class="os-sum-row dashed"><span>অ্যাকাউন্ট</span><span id="os-s-acc" class="v"></span></div>
        <div class="os-sum-total"><span>আপনি পাবেন</span><span id="os-s-total" class="total"></span></div>
      </div>

        <!-- বায়ার নোটিস -->
      <div id="os-notice-wrap" class="os-notice" hidden>
        <div class="os-notice-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          বায়ারের নির্দেশনা
        </div>
        <div id="os-notice" class="os-notice-body"></div>
      </div>
    </div>
  </main>

  <div class="os-foot">
    <a id="os-continue" href="chat-view.html" class="btn btn-primary">
      চ্যাটে যান
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js"></script>
<script>(async()=>{ if(window.cfRequireLogin) await window.cfRequireLogin("welcome.html"); })();</script>
<script src="order-setup.js"></script>
</body>
</html>
